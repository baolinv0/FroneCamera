[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fronecamera"
version = "0.1.0"
description = "Evidence-oriented front-camera portrait evaluation system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pillow-heif>=0.21,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=63,<70"]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
portrait-eval-api = "portrait_eval.cli:main"
portrait-eval-worker = "portrait_eval.worker:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portrait_eval = ["static/*.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
packages = ["portrait_eval"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false
allow_subclassing_any = true

[[tool.mypy.overrides]]
module = "portrait_eval.imaging"
disable_error_code = ["attr-defined"]
