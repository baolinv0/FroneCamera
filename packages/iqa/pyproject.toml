[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-tmqa"
version = "0.2.0"
description = "Multi-model visual review and human calibration for tone-mapping quality evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "pillow-heif>=0.21,<2",
  "opencv-python-headless>=4.9",
  "pydantic>=2.7",
  "PyYAML>=6",
  "httpx>=0.27",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1.2"]

[project.scripts]
qwen-tmqa = "qwen_tmqa.cli:main"
iqa-compare = "qwen_tmqa.comparison_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_tmqa = ["assets/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
