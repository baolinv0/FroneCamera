<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · 人工盲审</title><style>
body{margin:0;background:#f4f7f8;color:#14212b;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #d9e0e5;border-radius:12px;padding:16px;margin-bottom:14px}.toolbar{display:flex;gap:12px;flex-wrap:wrap}.filmstrip{display:flex;gap:8px;overflow:auto}.thumb{flex:0 0 120px;border:2px solid transparent;background:#fff;padding:5px}.thumb.selected{border-color:#087f8c}.thumb img{width:100%;height:74px;object-fit:cover}.viewer{width:100%;height:min(55vh,520px);object-fit:contain;background:#111}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{display:block;margin:8px 0}input,select,textarea{width:100%;padding:8px;box-sizing:border-box}.button{padding:10px 14px;background:#087f8c;color:#fff;border:0;border-radius:8px}.hidden{display:none}pre{white-space:pre-wrap;word-break:break-word;background:#101a21;color:#e1edf2;padding:14px;max-height:500px;overflow:auto}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}
</style></head><body><main><h1>人工盲审</h1><p>只审核分歧、尾部和高风险场景；提交成功前客户端仅持有图像与 Alpha 元数据。</p><div class="card"><label>Review Queue<select id="reviewQueueSelect"></select></label><img id="reviewMainImage" class="viewer"><div id="reviewSelectedManifest"></div><div id="reviewFilmstrip" class="filmstrip"></div></div><form id="blind-review-form" class="card"><h2>人工独立评价</h2><label>Reviewer ID<input name="reviewer_id" required></label><label>Decision<select name="human_decision" required><option value="">请选择</option><option>KEEP</option><option>REGENERATE</option><option>REVIEW</option><option>REJECT</option></select></label><div class="formgrid"><label>Overall<input name="human_overall" type="number" min="0" max="100" value="75" required></label><label>Confidence<input name="human_confidence" type="number" min="0" max="100" value="80" required></label><label>Tone<input name="human_tone" type="number" min="0" max="100" value="75"></label><label>Color<input name="human_color" type="number" min="0" max="100" value="75"></label><label>Fidelity<input name="human_fidelity" type="number" min="0" max="100" value="75"></label><label>Control<input name="human_control" type="number" min="0" max="100" value="75"></label><label>Preference<input name="human_preference" type="number" min="0" max="100" value="75"></label></div><label>Issues<input name="human_issues"></label><label>Regions<input name="human_regions"></label><label>Rationale<textarea name="human_rationale" rows="4"></textarea></label><button class="button" type="submit">提交人工判断并揭示结果</button><div id="reviewStatus"></div></form><section id="revealAfterReview" class="card hidden"><h2>提交后对照</h2><pre id="revealedEvidence"></pre></section></main><script>
const REVIEW_DATA=__EMBEDDED_REVIEWER_DATA__;let reviewSelectedManifest=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function currentScene(){return REVIEW_DATA.scenes.find(x=>x.scene_id===$('reviewQueueSelect').value)||REVIEW_DATA.scenes[0]}function renderReviewFilmstrip(){const scene=currentScene();if(!scene)return;const items=scene.images||[];if(!reviewSelectedManifest||!items.some(x=>x.index===reviewSelectedManifest.index))reviewSelectedManifest=items.find(x=>x.role==='baseline')||items[0];const selected=reviewSelectedManifest;$('reviewFilmstrip').innerHTML='';items.forEach(item=>{const b=document.createElement('button');b.type='button';b.className=`thumb ${selected&&selected.index===item.index?'selected':''}`;b.innerHTML=`<img src="${esc(item.url)}"><span>${esc(item.level)}</span>`;b.onclick=()=>{reviewSelectedManifest=item;renderReviewFilmstrip()};$('reviewFilmstrip').appendChild(b)});$('reviewMainImage').src=reviewSelectedManifest?.url||'';$('reviewSelectedManifest').textContent=reviewSelectedManifest?`Image ${reviewSelectedManifest.index} · ${reviewSelectedManifest.role} · ${reviewSelectedManifest.level}`:''}
async function submitHumanReview(event){event.preventDefault();const fd=new FormData(event.currentTarget);const scores={};['overall','tone','color','fidelity','control','preference'].forEach(key=>{const value=fd.get(`human_${key}`);if(value!==''&&value!==null)scores[key]=Number(value)/100});const review={review_id:`review-${Date.now()}-${Math.random().toString(16).slice(2)}`,scene_id:$('reviewQueueSelect').value,reviewer_id:String(fd.get('reviewer_id')||'').trim(),blind_review:true,decision:fd.get('human_decision'),scores,issues:String(fd.get('human_issues')||'').split(',').map(x=>x.trim()).filter(Boolean),regions:String(fd.get('human_regions')||'').split(',').map(x=>x.trim()).filter(Boolean),rationale:String(fd.get('human_rationale')||''),confidence:Number(fd.get('human_confidence'))/100,synthetic:false};$('reviewStatus').textContent='正在保存…';try{const response=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(review)});const responseBody=await response.json();if(!response.ok)throw new Error(responseBody.error||`HTTP ${response.status}`);const revealResponse=await fetch(responseBody.reveal_url);if(!revealResponse.ok)throw new Error('揭示授权失败');const revealed=await revealResponse.json();$('reviewStatus').textContent='人工判断已保存。';$('revealedEvidence').textContent=JSON.stringify(revealed,null,2);$('revealAfterReview').classList.remove('hidden')}catch(error){$('reviewStatus').textContent=`保存失败：${error.message}`}}
$('reviewQueueSelect').innerHTML=REVIEW_DATA.scenes.map(x=>`<option value="${esc(x.scene_id)}">${esc(x.scene_id)}</option>`).join('');$('reviewQueueSelect').onchange=()=>{reviewSelectedManifest=null;$('revealAfterReview').classList.add('hidden');renderReviewFilmstrip()};$('blind-review-form').addEventListener('submit',submitHumanReview);renderReviewFilmstrip();
</script></body></html>
