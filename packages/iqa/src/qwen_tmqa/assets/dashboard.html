<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f4f7f8;--paper:#fff;--ink:#14212b;--muted:#63717d;--line:#d9e0e5;--accent:#087f8c;--bad:#b42318;--warn:#b46200;--good:#16734b}*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}header{padding:16px 22px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}nav{background:#132a37;padding:16px}nav button{display:block;width:100%;padding:10px;border:0;border-radius:8px;background:transparent;color:#e5eef2;text-align:left;margin:3px 0}nav button.active{background:#eaf6f6;color:#075c65}main{padding:22px;min-width:0}.view{display:none}.view.active{display:block}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:14px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.metric strong{display:block;font-size:24px}.muted{color:var(--muted)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}select{padding:8px}.filmstrip{display:flex;gap:8px;overflow:auto}.thumb{flex:0 0 120px;background:#fff;border:2px solid transparent;border-radius:8px;padding:5px}.thumb.selected{border-color:var(--accent)}.thumb img{width:100%;height:74px;object-fit:cover}.viewer{width:100%;max-height:520px;object-fit:contain;background:#111}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#eaf6f6}.stage{border-left:4px solid var(--good)}.stage.WARN{border-left-color:var(--warn)}.stage.FAIL{border-left-color:var(--bad)}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}pre{white-space:pre-wrap;word-break:break-word;background:#101a21;color:#e1edf2;padding:14px;max-height:500px;overflow:auto}.tabs button{padding:7px;margin-right:5px}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto}nav button{min-width:max-content}}
</style>
</head>
<body>
<header><strong>__TITLE__</strong> <span class="muted">Engineering evaluation observability</span></header>
<div class="layout"><nav>
<button class="nav active" data-target="overview">数据集总览</button>
<button class="nav" data-target="scene">单场景检查</button>
<button class="nav" data-target="stages">阶段追踪</button>
<button class="nav" data-target="models">多模型评分</button>
<button class="nav" data-target="prompt">Prompt Inspector</button>
<button class="nav" data-target="queue">分歧与风险队列</button>
<button class="nav" data-target="reliability">模型可靠性</button>
</nav><main>
<section class="view active" data-view="overview"><h1>数据集总览</h1><div id="overview" class="grid"></div><h2>Decision distribution</h2><div id="decisionDistribution" class="grid"></div></section>
<section class="view" data-view="scene"><h1>单场景检查</h1><div class="toolbar"><select id="sceneSelect"></select><select id="viewerMode"><option value="image">图像</option><option value="difference-map">difference-map</option></select></div><img id="mainImage" class="viewer"><div id="alpha-filmstrip" class="filmstrip"></div><div id="sceneInfo" class="card"></div><h2>Objective metrics</h2><div id="alphaMetrics" class="grid"></div></section>
<section class="view" data-view="stages"><h1>阶段追踪</h1><div id="stageTrace"></div></section>
<section class="view" data-view="models"><h1>多模型评分</h1><div class="card"><table id="modelMatrix"></table></div></section>
<section class="view" data-view="prompt"><h1>Prompt Inspector</h1><select id="promptModelSelect"></select><div id="promptMetadata" class="card"></div><div class="tabs"><button data-tab="rendered">Rendered Prompt</button><button data-tab="template">Template</button><button data-tab="inputs">Input Manifest</button><button data-tab="diff">Version Diff</button><button data-tab="raw">Raw Response</button><button data-tab="parsed">Parsed JSON</button></div><pre id="promptViewer"></pre></section>
<section class="view" data-view="queue"><h1>分歧与风险队列</h1><div id="queueList"></div></section>
<section class="view" data-view="reliability"><h1>模型可靠性</h1><div id="calibrationNotice" class="card"></div><div id="reliabilityGrid" class="grid"></div><h2>Pairwise model gap</h2><div id="pairwiseGaps" class="card"></div></section>
</main></div>
<script>
const DATA=__EMBEDDED_DATA__;const DIMS=['tone','color','fidelity','control','preference','overall'];let selectedScene=DATA.scenes[0];let selectedImage=null;let promptTab='rendered';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const score=v=>Number.isFinite(Number(v))?(Number(v)*100).toFixed(1):'—';
document.querySelectorAll('.nav').forEach(button=>button.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.dataset.view===button.dataset.target))});
function manifest(scene){return scene.model_evaluations?.[0]?.prompt_trace?.input_manifest||[]}function imageUrl(scene,item,diff=false){const key=`${item.index}:${item.level}`;return scene.visual_paths[diff?`diff:${key}`:key]||scene.visual_paths[key]||''}
function setScene(id){selectedScene=DATA.scenes.find(x=>x.scene_id===id)||DATA.scenes[0];selectedImage=manifest(selectedScene).find(x=>x.role==='baseline')||manifest(selectedScene)[0];renderScene();renderStages();renderModels();renderPromptModels()}
function renderOverview(){
  $('overview').innerHTML=[['场景数',DATA.summary.scene_count],['平均分',score(DATA.summary.mean_score)],['P10',score(DATA.summary.p10_score)],['人工队列',DATA.review_queue.length],['低置信场景',DATA.summary.low_confidence_count],['Synthetic dataset',DATA.summary.synthetic?'yes':'no']].map(x=>`<div class="card metric"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('');
  $('decisionDistribution').innerHTML=Object.entries(DATA.summary.decisions||{}).map(([decision,count])=>`<div class="card metric"><span>${esc(decision)}</span><strong>${count}</strong></div>`).join('');
}
function renderScene(){
  const items=manifest(selectedScene);$('alpha-filmstrip').innerHTML='';
  items.forEach(item=>{const b=document.createElement('button');b.className=`thumb ${selectedImage&&selectedImage.index===item.index?'selected':''}`;b.innerHTML=`<img src="${esc(imageUrl(selectedScene,item))}"><span>${esc(item.level)}</span>`;b.onclick=()=>{selectedImage=item;renderScene()};$('alpha-filmstrip').appendChild(b)});
  $('mainImage').src=imageUrl(selectedScene,selectedImage,$('viewerMode').value==='difference-map');
  $('sceneInfo').innerHTML=`<strong>${esc(selectedScene.scene_id)}</strong> ${esc(selectedScene.decision)} · ${score(selectedScene.overall_score)}`;
  const metrics=selectedScene.objective_by_level?.[selectedImage?.level]||{};
  $('alphaMetrics').innerHTML=Object.entries(metrics).map(([name,value])=>`<div class="card metric"><span>${esc(name)}</span><strong>${typeof value==='number'?Number(value).toFixed(4):esc(value)}</strong></div>`).join('')||'<div class="card">No objective metrics</div>';
}
function renderStages(){$('stageTrace').innerHTML=selectedScene.stages.map(s=>`<div class="card stage ${s.status}"><strong>${esc(s.stage_id)} · ${esc(s.status)}</strong><div>${esc((s.evidence||[]).join(' · '))}</div></div>`).join('')}
function renderModels(){
  const models=selectedScene.model_evaluations||[];
  const gaps=Object.fromEntries(DIMS.map(d=>{const values=models.filter(m=>m.available&&Number.isFinite(Number(m.scores?.[d]))).map(m=>Number(m.scores[d]));return[d,values.length?Math.max(...values)-Math.min(...values):null]}));
  $('modelMatrix').innerHTML=`<tr><th>模型</th><th>Model version</th><th>Role</th><th>Availability</th><th>Synthetic model</th><th>Confidence</th>${DIMS.map(x=>`<th>${x}</th>`).join('')}<th>决策</th></tr>`+models.map(m=>`<tr><td>${esc(m.model_id)}</td><td>${esc(m.model_version)}</td><td>${esc(m.model_role)}</td><td>${m.available?'available':'unavailable'}</td><td>${m.synthetic?'yes':'no'}</td><td>${score(m.confidence)}</td>${DIMS.map(d=>`<td>${m.available?score(m.scores?.[d]):'—'}</td>`).join('')}<td>${esc(m.available?m.decision:'UNAVAILABLE')}</td></tr>`).join('')+`<tr><th colspan="6">Model score gap</th>${DIMS.map(d=>`<td>${score(gaps[d])}</td>`).join('')}<td>—</td></tr>`;
}
function renderPromptModels(){$('promptModelSelect').innerHTML=(selectedScene.model_evaluations||[]).map((m,i)=>`<option value="${i}">${esc(m.model_id)}</option>`).join('');$('promptModelSelect').onchange=renderPrompt;renderPrompt()}
function renderPrompt(){const m=selectedScene.model_evaluations?.[Number($('promptModelSelect').value)||0];if(!m)return;const t=m.prompt_trace;$('promptMetadata').innerHTML=`<div><strong>Prompt ID</strong> ${esc(t.prompt_id)}</div><div><strong>Prompt version</strong> ${esc(t.prompt_version)}</div><div><strong>Prompt hash</strong> ${esc(t.prompt_hash)}</div><div><strong>Schema version</strong> ${esc(t.output_schema_version)}</div><div><strong>Rendered variables</strong><pre>${esc(JSON.stringify(t.variables,null,2))}</pre></div><div><strong>Inference parameters</strong><pre>${esc(JSON.stringify(t.inference_parameters,null,2))}</pre></div>`;const values={rendered:t.rendered_prompt,template:t.template,inputs:JSON.stringify(t.input_manifest,null,2),diff:m.prompt_diff||'',raw:m.raw_response||'',parsed:JSON.stringify(m.parsed_response,null,2)};$('promptViewer').textContent=values[promptTab]||''}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{promptTab=b.dataset.tab;renderPrompt()});function renderQueue(){$('queueList').innerHTML=DATA.review_queue.map(id=>{const s=DATA.scenes.find(x=>x.scene_id===id);return `<div class="card"><strong>${esc(id)}</strong><div>${esc((s?.review_reasons||[]).join(' · '))}</div></div>`}).join('')||'<div class="card">Empty</div>'}function renderReliability(){const c=DATA.calibration||{};const n=c.sample_sufficiency||{};$('calibrationNotice').textContent=c.warning||'No calibration sufficiency evidence';$('calibrationNotice').dataset.sufficient=String(n.sufficient===true);$('reliabilityGrid').innerHTML=DATA.reliability.map(x=>`<div class="card"><strong>${esc(x.model_id)}</strong><div>Sample count ${x.sample_count}</div><div>Paired overall samples ${Number.isInteger(x.overall_sample_count)?x.overall_sample_count:"unknown"}</div><div>Model sources ${esc((x.model_sources?.length?x.model_sources:["unknown"]).join(", "))}</div><div>Decision agreement ${score(x.decision_agreement)}</div><div>Human-model delta (overall MAE) ${score(x.overall_mae)}</div><div>Dimension MAE <pre>${esc(JSON.stringify(x.dimension_mae,null,2))}</pre></div><div>Fusion weight ${score(x.fusion_weight)}</div><div>Weight use ${esc(x.fusion_weight_scope||"research")}</div><div>Production eligible ${x.production_eligible===true?"yes":"no"}</div></div>`).join('')||'<div class="card">No calibration</div>';$('pairwiseGaps').innerHTML=Object.entries(DATA.pairwise_mean_gap||{}).map(([pair,gap])=>`<div><strong>${esc(pair)}</strong> ${score(gap)}</div>`).join('')||'No pairwise gaps'}
$('sceneSelect').innerHTML=DATA.scenes.map(x=>`<option>${esc(x.scene_id)}</option>`).join('');$('sceneSelect').onchange=e=>setScene(e.target.value);$('viewerMode').onchange=renderScene;renderOverview();renderQueue();renderReliability();setScene(DATA.scenes[0].scene_id);
</script></body></html>
