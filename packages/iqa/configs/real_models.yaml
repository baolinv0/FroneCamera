dataset:
  baseline_level: a_000
  strict_complete: true
  recursive: true
  generator: production_generator
judges:
  - id: minicpm-prescreener
    role: prescreener
    adapter: openai_compatible
    model: openbmb/MiniCPM-V-4_5
    version: deployed-checkpoint
    base_url: http://127.0.0.1:8000/v1
    prompt_id: tmqa.sequence
    prompt_version: '3.2'
    timeout_seconds: 120
    temperature: 0.0
    max_tokens: 1000
  - id: qwen-primary
    role: primary
    adapter: openai_compatible
    model: Qwen/Qwen3-VL-8B-Instruct
    version: deployed-checkpoint
    base_url: http://127.0.0.1:8001/v1
    prompt_id: tmqa.sequence
    prompt_version: '3.2'
    timeout_seconds: 180
    temperature: 0.0
    max_tokens: 1400
  - id: internvl-arbiter
    role: arbiter
    adapter: openai_compatible
    model: OpenGVLab/InternVL3_5-38B
    version: deployed-checkpoint
    base_url: http://127.0.0.1:8002/v1
    prompt_id: tmqa.sequence
    prompt_version: '3.2'
    timeout_seconds: 240
    temperature: 0.0
    max_tokens: 1400
  - id: ovis-local
    role: local_inspector
    adapter: openai_compatible
    model: AIDC-AI/Ovis2.6-30B-A3B
    version: deployed-checkpoint
    base_url: http://127.0.0.1:8003/v1
    prompt_id: tmqa.sequence
    prompt_version: '3.2'
    timeout_seconds: 240
    temperature: 0.0
    max_tokens: 1400
review:
  max_queue_size: 200
  disagreement_threshold: 0.15
  tail_percentile: 0.10
  high_risk_threshold: 0.60
  random_audit_fraction: 0.0
visualization:
  title: Qwen-TMQA Visual Review
  include_raw_response: true
  include_prompt_diff: true
  default_blind_review: true
