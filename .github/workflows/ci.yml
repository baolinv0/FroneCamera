name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./packages/iqa[dev]" -e ".[dev]"
      - run: pytest -q
      - run: set -o pipefail; ruff check src tests scripts 2>&1 | tee backend-ruff.log
      - run: set -o pipefail; ruff format --check src scripts 2>&1 | tee backend-format.log
      - run: set -o pipefail; mypy src/portrait_eval 2>&1 | tee backend-mypy.log
      - name: Upload backend validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation-logs
          path: backend-*.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock
      - run: set -o pipefail; npm test -- --run 2>&1 | tee frontend-test.log
      - run: set -o pipefail; npm run build 2>&1 | tee frontend-build.log
      - name: Upload frontend validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-logs
          path: web/frontend-*.log

  iqa-verify:
    name: verify (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/iqa
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Record exact branch head
        run: |
          mkdir -p runs/ci-evidence
          printf '%s\n' "$HEAD_SHA" | tee runs/ci-evidence/branch_head_sha.txt
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: V-001 Compile
        run: python -m compileall -q src tests scripts
      - name: V-002 Ruff
        run: set -o pipefail; python -m ruff check . | tee runs/ci-evidence/ruff.log
      - name: V-003 Full pytest
        run: set -o pipefail; python -m pytest -q | tee runs/ci-evidence/pytest.log
      - name: V-011 through V-018 focused commands
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -k 'strict_complete or expected_levels or non_image or recursive' | tee runs/ci-evidence/V-011-dataset-contract.log
          python -m pytest -q -k 'judge or openai_adapter or score_contract or model_failure' | tee runs/ci-evidence/V-012-judge-contract.log
          python -m pytest -q -k 'payload_hash or input_manifest or exif_orientation or image_payload' | tee runs/ci-evidence/V-013-payload-trace.log
          python -m pytest -q -k 'prompt_version or immutable_prompt or output_schema_version' | tee runs/ci-evidence/V-014-prompt-versioning.log
          python -m pytest -q -k 'fatal or all_unavailable or decision_disagreement or unanimous_reject or unanimous_regenerate' | tee runs/ci-evidence/V-015-decision-safety.log
          python -m pytest -q -k 'blind_review or reviewer_payload or reveal_api or review_server or focused_queue or received_at' | tee runs/ci-evidence/V-016-blind-review-server.log
          python -m pytest -q -k 'dashboard or visualization or prompt_inspector or model_human_delta' | tee runs/ci-evidence/V-017-dashboard-functional.log
          python -m pytest -q -k 'calibration and (synthetic or reviewer or reliability or fusion)' | tee runs/ci-evidence/V-018-calibration-isolation.log
      - name: V-004 Build sdist and Wheel
        run: |
          rm -rf dist build
          python -m build
          sha256sum dist/* | tee runs/ci-evidence/dist-sha256.txt
      - name: V-005 Isolated Wheel install
        run: >-
          python scripts/verify_wheel_install.py
          --dist dist
          --target .verification/wheel-target-${{ matrix.python-version }}
          --expected-version 0.2.0
      - name: V-006 CLI contract
        run: >-
          python scripts/verify_cli_contract.py
          --config configs/default.yaml
          --workdir .verification/cli-${{ matrix.python-version }}
      - name: V-007 deterministic synthetic E2E
        if: matrix.python-version == '3.12'
        run: bash scripts/run_verified_experiment.sh runs/verified_experiment
      - name: Upload exact-head mechanical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmqa-v0.2-mechanical-${{ matrix.python-version }}-${{ env.HEAD_SHA }}
          path: |
            packages/iqa/runs/ci-evidence
            packages/iqa/dist
            packages/iqa/.verification/cli-${{ matrix.python-version }}
            packages/iqa/runs/verified_experiment
          if-no-files-found: warn

  iqa-exact-head-audit:
    name: exact-head audit
    needs: iqa-verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/iqa
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - uses: actions/download-artifact@v4
        with:
          name: tmqa-v0.2-mechanical-3.12-${{ env.HEAD_SHA }}
          path: packages/iqa/aggregate
      - name: Bind behavioral and exact-head CI evidence
        run: >-
          python scripts/generate_verification_evidence.py
          --results aggregate/runs/verified_experiment/results/evaluations.json
          --output aggregate/runs/verified_experiment/verification_evidence.json
          --head-sha "$HEAD_SHA"
          --ci-run-id "${{ github.run_id }}"
          --ci-tested-head-sha "$HEAD_SHA"
          --python-3-10-status success
          --python-3-12-status success
      - name: V-009 exact-head requirements audit
        run: >-
          qwen-tmqa audit
          --results aggregate/runs/verified_experiment/results/evaluations.json
          --dashboard aggregate/runs/verified_experiment/dashboard
          --reviews aggregate/runs/verified_experiment/reviews.jsonl
          --calibration aggregate/runs/verified_experiment/calibration.json
          --evidence aggregate/runs/verified_experiment/verification_evidence.json
          --expected-head-sha "$HEAD_SHA"
          --output aggregate/runs/verified_experiment/requirements_audit.json
      - name: Verify 19 of 19 structured audit result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('aggregate/runs/verified_experiment/requirements_audit.json').read_text())
          assert payload['schema_version'] == 'tmqa.requirements-audit.v2', payload
          assert payload['overall'] == 'PASS', payload
          assert payload['passed'] == payload['required'] == 19, payload
          required_fields = {'implementation_locations', 'test_locations', 'execution_command', 'measurable_threshold', 'actual_evidence', 'final_status'}
          assert set(payload['requirements']) == {f'R-{i:03d}' for i in range(1, 20)}
          assert all(required_fields <= set(record) and record['final_status'] == 'PASS' for record in payload['requirements'].values())
          print('19/19 structured MUST audit PASS')
          PY
      - name: Upload final exact-head audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: tmqa-v0.2-exact-head-audit-${{ env.HEAD_SHA }}
          path: packages/iqa/aggregate/runs/verified_experiment
