services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PORTRAIT_EVAL_DATABASE_URL: sqlite:////workspace/portrait_eval.db
      PORTRAIT_EVAL_WORKSPACE: /workspace
      PORTRAIT_EVAL_VLM_PROVIDER: ${PORTRAIT_EVAL_VLM_PROVIDER:-local}
      PORTRAIT_EVAL_OPENAI_API_KEY: ${PORTRAIT_EVAL_OPENAI_API_KEY:-}
      PORTRAIT_EVAL_OPENAI_BASE_URL: ${PORTRAIT_EVAL_OPENAI_BASE_URL:-https://api.openai.com}
      PORTRAIT_EVAL_OPENAI_PRIMARY_MODEL: ${PORTRAIT_EVAL_OPENAI_PRIMARY_MODEL:-gpt-5.6-sol}
      PORTRAIT_EVAL_OPENAI_REVIEWER_MODEL: ${PORTRAIT_EVAL_OPENAI_REVIEWER_MODEL:-gpt-5.6-sol}
    volumes:
      - ${FRONECAMERA_DATA_ROOT:-./sample-data}:/data:ro
      - fronecamera-workspace:/workspace
    ports:
      - "127.0.0.1:7860:7860"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      PORTRAIT_EVAL_DATABASE_URL: sqlite:////workspace/portrait_eval.db
      PORTRAIT_EVAL_WORKSPACE: /workspace
      PORTRAIT_EVAL_VLM_PROVIDER: ${PORTRAIT_EVAL_VLM_PROVIDER:-local}
      PORTRAIT_EVAL_OPENAI_API_KEY: ${PORTRAIT_EVAL_OPENAI_API_KEY:-}
      PORTRAIT_EVAL_OPENAI_BASE_URL: ${PORTRAIT_EVAL_OPENAI_BASE_URL:-https://api.openai.com}
      PORTRAIT_EVAL_OPENAI_PRIMARY_MODEL: ${PORTRAIT_EVAL_OPENAI_PRIMARY_MODEL:-gpt-5.6-sol}
      PORTRAIT_EVAL_OPENAI_REVIEWER_MODEL: ${PORTRAIT_EVAL_OPENAI_REVIEWER_MODEL:-gpt-5.6-sol}
      PORTRAIT_EVAL_PRIMARY_VLM_URL: ${PORTRAIT_EVAL_PRIMARY_VLM_URL:-}
      PORTRAIT_EVAL_REVIEWER_VLM_URL: ${PORTRAIT_EVAL_REVIEWER_VLM_URL:-}
      PORTRAIT_EVAL_SEARCH_PROVIDER: ${PORTRAIT_EVAL_SEARCH_PROVIDER:-disabled}
      PORTRAIT_EVAL_SEARXNG_URL: ${PORTRAIT_EVAL_SEARXNG_URL:-}
    volumes:
      - ${FRONECAMERA_DATA_ROOT:-./sample-data}:/data:ro
      - fronecamera-workspace:/workspace
      - ${FRONECAMERA_MODEL_ROOT:-./models}:/models:ro
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  fronecamera-workspace:
